services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_secret
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      SERVICE_ROLE: api
      PORT: 3000
      DATABASE_URL: postgres://ledger:ledger_secret@postgres:5432/ledger_db
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  webhook-worker:
    build: .
    environment:
      SERVICE_ROLE: webhook-worker
      DATABASE_URL: postgres://ledger:ledger_secret@postgres:5432/ledger_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  billing-worker:
    build: .
    environment:
      SERVICE_ROLE: billing-worker
      DATABASE_URL: postgres://ledger:ledger_secret@postgres:5432/ledger_db
    depends_on:
      postgres:
        condition: service_healthy

